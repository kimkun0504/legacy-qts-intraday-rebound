[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qts-intraday-rebound"
version = "0.1.0"
description = "Intraday rebound after news-free drops, on the qts and qts-small-cap infrastructure"
readme = "README.md"
requires-python = ">=3.10"
# Not on PyPI: install the sibling checkouts first
# (pip install -e ../quant-trading-system -e ../qts-small-cap), then this package.
dependencies = ["qts", "qts-smallcap", "duckdb>=0.10", "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.16"]
explore = ["numba>=0.60"]

[tool.setuptools.packages.find]
include = ["qts_rebound*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["."]
extend-exclude = ["runs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "NPY", "PD", "C4", "RUF"]
ignore = ["PD011", "PD008", "PD009", "PD010", "PD013", "PD015", "E501", "E741",
          "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["qts_rebound"]
known-third-party = ["qts", "qts_smallcap"]

[tool.pytest.ini_options]
addopts = "--strict-markers -q"
testpaths = ["tests"]
